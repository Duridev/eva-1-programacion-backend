<!--
==============================================================================
PLANTILLA: templates/base.html
------------------------------------------------------------------------------
¿PARA QUÉ SIRVE ESTE ARCHIVO?
Es la plantilla madre o "layout base" de toda la aplicación web. Contiene el
esqueleto HTML común (etiquetas html, head, body, barra de navegación,
pie de página y enlaces a CSS y JS).

¿QUÉ FUNCIONES REALIZA DENTRO DEL PROGRAMA?
1. Implementa la "Herencia de Plantillas" de Django mediante bloques:
   - Bloque 'title': Permite que cada página defina su propio título en la pestaña.
   - Bloque 'content': Espacio donde las páginas hijas (register, login, welcome)
     inyectan su contenido específico sin repetir el código del encabezado ni del footer.
2. Utiliza la etiqueta 'load static' para resolver rutas a archivos CSS y JS.
3. Carga el script JS al final del body para optimizar la velocidad de carga.
==============================================================================
-->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bloque dinámico para el título de la pestaña del navegador -->
    <title>{% block title %}Sistema de Autenticación{% endblock %}</title>

    <!-- Tipografía Inter para un diseño moderno y legible -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Enlace al archivo CSS principal usando la etiqueta static de Django -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Barra superior de navegación común a todas las páginas -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/login/" class="brand-logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">Evaluación Backend 1</span>
            </a>
            <nav class="nav-links">
                <a href="/login/" class="nav-item">Iniciar Sesión</a>
                <a href="/registro/" class="nav-item nav-btn">Registrarse</a>
            </nav>
        </div>
    </header>

    <!-- Contenedor principal donde cada plantilla hija inyecta su contenido -->
    <main class="main-layout">
        {% block content %}
        <!-- Aquí se insertará el HTML de register.html, login.html o welcome.html -->
        {% endblock %}
    </main>

    <!-- Pie de página informativo del proyecto -->
    <footer class="footer">
        <p>Proyecto Universitario Django — Arquitectura EDD en Memoria (sin DB)</p>
    </footer>

    <!-- Script de interactividad UX cargado al final del documento -->
    <script src="{% static 'js/validaciones.js' %}"></script>
</body>
</html>
