{% extends "base.html" %}

{% block title %}Actualizar Producto — Gestión de Productos{% endblock %}

{% block content %}
<!--
==============================================================================
PLANTILLA: templates/productos/form_actualizar.html
------------------------------------------------------------------------------
¿PARA QUÉ SIRVE ESTE ARCHIVO?
Permite la modificación de los datos de un producto previamente registrado.

¿QUÉ FUNCIONES REALIZA DENTRO DEL PROGRAMA?
1. Envía los datos actualizados vía POST a la URL '/actualizar/{{ producto.id }}/'.
2. Incluye token csrf para seguridad en Django.
3. Precarga los datos existentes en los campos:
   - Nombre: value="{{ producto.nombre }}"
   - Marca: Opción con atributo 'selected' para la marca guardada actualmente.
   - Precio: value="{{ producto.precio }}"
4. Muestra alertas en caso de que ocurra algún error de validación en la actualización.
5. Permite guardar cambios o cancelar volviendo al listado.
==============================================================================
-->
<div class="row justify-content-center py-3">
    <div class="col-lg-7 col-md-9">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-warning text-dark text-center py-3 rounded-top-4">
                <h2 class="h4 mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Producto (ID: {{ producto.id }})</h2>
            </div>
            <div class="card-body p-4">

                <!-- Alerta de error si ocurre un problema de validación -->
                {% if msjErr %}
                <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
                    <div>{{ msjErr }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
                {% endif %}

                <!-- Formulario de actualización de producto -->
                <form action="/actualizar/{{ producto.id }}/" method="post">
                    <!-- Token de seguridad CSRF obligatorio -->
                    {% csrf_token %}

                    <!-- Campo: Nombre del producto (txtnom) -->
                    <div class="mb-3">
                        <label for="txtnom" class="form-label fw-semibold">Nombre del Producto</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="txtnom" 
                            name="txtnom" 
                            maxlength="100" 
                            value="{{ producto.nombre }}" 
                            required
                        >
                    </div>

                    <!-- Campo: Marca del producto (cbomar) con opción 'selected' -->
                    <div class="mb-3">
                        <label for="cbomar" class="form-label fw-semibold">Marca</label>
                        <select class="form-select" id="cbomar" name="cbomar" required>
                            {% for m in marcas %}
                                <option value="{{ m }}" {% if producto.marca == m %}selected{% endif %}>{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Campo: Precio del producto (txtpre) -->
                    <div class="mb-4">
                        <label for="txtpre" class="form-label fw-semibold">Precio (CLP)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input 
                                type="number" 
                                class="form-control" 
                                id="txtpre" 
                                name="txtpre" 
                                min="1" 
                                max="9999999" 
                                value="{{ producto.precio }}" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-between pt-2">
                        <a href="/listado/" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-circle me-1"></i> Cancelar / Volver al Listado
                        </a>
                        <button type="submit" class="btn btn-warning px-4 fw-semibold text-dark">
                            <i class="bi bi-check-lg me-1"></i> Actualizar Producto
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
